<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Factory</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --line:#e5e1d8; --ink:#20242b; --ink2:#6b7280;
  --accent:#0f6b4f; --accent2:#0d5940; --warn:#b3372b; --amber:#a3641c;
  --chip:#eef2ee; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.4rem;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{color:var(--ink2);font-size:.85rem}
#live{margin-left:auto;font-size:.78rem;color:var(--ink2)}
#live b{color:var(--accent)}
main{display:grid;grid-template-columns:370px 1fr;gap:1rem;padding:1rem 1.4rem;max-width:1500px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:1rem}
.card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.8px;color:var(--ink2);margin:0 0 .7rem}
input[type=text],textarea,select{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;font-size:.92rem;background:#fcfbf9;color:var(--ink)}
textarea{resize:vertical;min-height:70px;font-family:inherit}
button{padding:.55rem 1rem;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;transition:filter .15s}
button:hover{filter:brightness(1.07)}
button:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--warn);color:#fff}
.btn-ghost{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.mt{margin-top:.7rem}

/* run list */
.run-item{padding:.65rem .7rem;border:1px solid var(--line);border-radius:10px;margin-bottom:.5rem;cursor:pointer;background:#fcfbf9}
.run-item:hover{border-color:#c9c3b4}
.run-item.active{border-color:var(--accent);background:#f2f7f4}
.run-item .name{font-weight:650;font-size:.92rem}
.run-item .idea{color:var(--ink2);font-size:.8rem;margin:.15rem 0 .3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.run-item .meta{font-size:.72rem;color:var(--ink2);font-family:var(--mono)}
.pill{display:inline-block;padding:.13rem .55rem;border-radius:999px;font-size:.72rem;font-weight:650}
.pill.wait{background:#fff3d6;color:var(--amber)}
.pill.run{background:#e3edf7;color:#1c5d99}
.pill.done{background:#e2f2e8;color:var(--accent)}
.pill.fail{background:#fbe4e1;color:var(--warn)}

/* stepper */
.stepper{display:flex;flex-wrap:wrap;gap:.35rem .2rem;margin:.4rem 0 .2rem}
.step{display:flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--ink2)}
.step .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink2);font-size:.7rem;font-weight:700;border:1.5px solid var(--line)}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.step.now .dot{background:#fff;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px #0f6b4f22}
.step.now{color:var(--ink);font-weight:650}
.step.fail .dot{background:var(--warn);border-color:var(--warn);color:#fff}
.step .bar{width:16px;height:2px;background:var(--line);margin:0 .1rem}
.step.done .bar{background:var(--accent)}

/* stats + tokens */
.stats{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.stat{background:var(--chip);border-radius:10px;padding:.4rem .7rem;font-size:.8rem}
.stat b{display:block;font-size:1rem}
.swatches{display:flex;gap:.5rem;flex-wrap:wrap}
.swatch{width:86px}
.swatch .c{height:34px;border-radius:8px;border:1px solid var(--line)}
.swatch .l{font-size:.66rem;color:var(--ink2);margin-top:.2rem;font-family:var(--mono)}
.banner{border-radius:10px;padding:.7rem .9rem;font-size:.88rem;margin-bottom:.8rem}
.banner.err{background:#fbe4e1;color:#7c261d;border:1px solid #f0c3bd}
.banner.ok{background:#e2f2e8;color:#134f36;border:1px solid #bfe0cd}
pre{background:#f1efe8;border:1px solid var(--line);border-radius:10px;padding:.7rem;font-size:.78rem;overflow:auto;max-height:420px;font-family:var(--mono);line-height:1.45}
.filegrid{display:grid;grid-template-columns:230px 1fr;gap:.8rem}
@media(max-width:800px){.filegrid{grid-template-columns:1fr}}
.filelist{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fcfbf9}
.filelist div{padding:.4rem .6rem;font-family:var(--mono);font-size:.76rem;cursor:pointer;border-bottom:1px solid #f0ede4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filelist div:hover{background:var(--chip)}
.filelist div.sel{background:#e6efe9;color:var(--accent2);font-weight:600}
.empty{color:var(--ink2);text-align:center;padding:2.5rem 1rem;font-size:.9rem}
.kv{font-size:.86rem;line-height:1.6}
.kv b{font-weight:650}
.changelog{white-space:pre-wrap;font-size:.87rem;background:#fbfaf6;border:1px dashed var(--line);border-radius:10px;padding:.6rem .8rem}
</style>
</head>
<body>
<header>
  <span style="font-size:1.4rem">🏭</span>
  <div><h1>App Factory</h1><div class="sub">Otonom uygulama fabrikası — onay paneli</div></div>
  <div id="live">otomatik yenileme: <b>açık</b></div>
</header>
<main>
  <aside>
    <div class="card">
      <h2>Yeni Run</h2>
      <textarea id="idea" placeholder="Uygulama fikri — tek cümle yeter. Sistem gerisini halleder."></textarea>
      <div class="row mt">
        <select id="platform" style="width:auto">
          <option value="flutter">Flutter</option>
          <option value="react-native">React Native</option>
        </select>
        <button class="btn-primary" onclick="startRun()">🚀 Başlat</button>
      </div>
    </div>
    <div class="card">
      <h2>Run'lar</h2>
      <div id="runs"><div class="empty">Henüz run yok</div></div>
    </div>
  </aside>
  <section id="detail"><div class="card"><div class="empty">Soldan bir run seç veya yeni bir fikir başlat 👋</div></div></section>
</main>
<script>
const PHASES = [
  ["idea","Fikir"],["spec","Spec"],["design","Tasarım"],["coding","Kod"],
  ["qa","QA"],["visual_qa","Görsel QA"],["release","Sürüm"],
  ["awaiting_approval","Onay"],["deploying","Dağıtım"],["done","Bitti"],
];
let selected = null, selectedFile = null, timer = null;

const el = id => document.getElementById(id);
const esc = s => (s??"").toString().replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pill(phase, waiting){
  if (phase === "failed") return '<span class="pill fail">başarısız</span>';
  if (phase === "done") return '<span class="pill done">tamamlandı</span>';
  if (waiting) return '<span class="pill wait">onay bekliyor</span>';
  return '<span class="pill run">çalışıyor</span>';
}

async function loadRuns(){
  try{
    const runs = await (await fetch("/runs")).json();
    if (!runs.length){ el("runs").innerHTML = '<div class="empty">Henüz run yok</div>'; return; }
    el("runs").innerHTML = runs.map(r => `
      <div class="run-item ${r.run_id===selected?"active":""}" onclick="select('${r.run_id}')">
        <div class="row" style="justify-content:space-between">
          <span class="name">${esc(r.app_name || "…")}</span>
          ${pill(r.phase, r.awaiting_approval)}
        </div>
        <div class="idea">${esc(r.idea)}</div>
        <div class="meta">${r.run_id} · ${esc(r.platform)} · ${esc(r.created_at)}</div>
      </div>`).join("");
  }catch(e){/* sunucu meşgulken sessiz geç */}
}

function stepper(phase){
  const idx = PHASES.findIndex(p => p[0] === phase);
  const failIdx = phase === "failed" ? PHASES.length : -1;
  return '<div class="stepper">' + PHASES.map((p,i) => {
    let cls = "step";
    if (phase === "failed") cls += i < 7 ? " done" : (i === 7 ? " fail" : "");
    else if (i < idx || phase === "done") cls += " done";
    else if (i === idx) cls += " now";
    const bar = i < PHASES.length-1 ? '<span class="bar"></span>' : "";
    return `<span class="${cls}"><span class="dot">${(cls.includes("done"))?"✓":i+1}</span>${p[1]}${bar}</span>`;
  }).join("") + '</div>';
}

function tokens(t){
  if (!t) return "";
  const items = [["primary",t.primary_color],["secondary",t.secondary_color],
                 ["bg",t.background_color],["text",t.text_color]];
  return `<div class="card"><h2>Tasarım Sistemi</h2>
    <div class="swatches">${items.map(([l,c]) =>
      `<div class="swatch"><div class="c" style="background:${esc(c)}"></div><div class="l">${esc(c)}<br>${l}</div></div>`).join("")}
    </div>
    <div class="kv mt">Font: <b>${esc(t.font_family)}</b> · Radius: <b>${t.corner_radius}px</b> · Spacing: <b>${t.spacing_unit}px</b></div>
  </div>`;
}

async function select(id){
  selected = id; selectedFile = null; lastDetail = "";
  await Promise.all([renderDetail(true), loadRuns()]);
}

let lastDetail = "";
async function renderDetail(force){
  if (!selected) return;
  // kullanıcı yazarken DOM'u yeniden kurma (textarea silinmesin)
  const a = document.activeElement;
  if (!force && a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return;
  let d, raw;
  try{
    raw = await (await fetch("/runs/"+selected)).text();
    d = JSON.parse(raw);
  }catch(e){ return; }
  if (!force && raw === lastDetail) return;  // değişiklik yoksa dokunma
  lastDetail = raw;
  if (d.detail){ el("detail").innerHTML = `<div class="card"><div class="empty">${esc(d.detail)}</div></div>`; return; }

  const rc = d.release_candidate, c = d.app_concept || {};
  let html = `<div class="card">
    <div class="row" style="justify-content:space-between">
      <div><span style="font-size:1.25rem;font-weight:700">${esc(c.app_name || "İsimlendiriliyor…")}</span>
        <span class="meta" style="color:var(--ink2);font-size:.8rem;margin-left:.5rem">${selected} · ${esc(d.platform)}</span></div>
      ${pill(d.phase, d.awaiting_approval)}
    </div>
    ${stepper(d.phase)}
    <div class="stats">
      <div class="stat"><b>${d.qa_iteration}</b>QA iterasyonu</div>
      <div class="stat"><b>${d.visual_iteration}</b>Görsel QA</div>
      <div class="stat"><b>${d.escalation_level === "escalated" ? "Opus ⤴" : "Sonnet"}</b>model</div>
      <div class="stat"><b>${esc(d.build_status || "—")}</b>build</div>
    </div>
  </div>`;

  if (d.circuit_breaker_tripped)
    html += `<div class="banner err">⛔ <b>Circuit breaker devrede:</b> ${esc(d.failure_reason)}<br>
             Sistem bu sorunu kendi başına çözemedi — aşağıdan yorumla reddedip yeni bir deneme başlatabilirsin.</div>`;
  if (d.phase === "done")
    html += `<div class="banner ok">✅ ${esc(d.last_message)}</div>`;

  if (c.one_liner) html += `<div class="card"><h2>Konsept</h2><div class="kv">
      <b>${esc(c.one_liner)}</b><br>Çekirdek özellik: ${esc(c.core_feature)}<br>
      Hedef kitle: ${esc(c.target_audience)}<br>Fark: ${esc(c.differentiator)}
      ${d.screens?.length ? "<br>Ekranlar: <b>"+d.screens.map(esc).join(", ")+"</b>" : ""}</div></div>`;

  html += tokens(d.design_tokens);

  if (rc) html += `<div class="card"><h2>Sürüm Adayı</h2>
    <div class="kv"><b>${esc(rc.app_name)} v${esc(rc.version)}</b> ·
      artifact: ${rc.artifact_path ? `<code>${esc(rc.artifact_path)}</code>` : "üretilmedi (CI yapılandırması gerekli)"}<br>
      ${rc.qa_iterations_used} QA + ${rc.visual_iterations_used} görsel QA iterasyonuyla hazırlandı</div>
    <div class="changelog mt">${esc(rc.changelog)}</div></div>`;

  if (d.awaiting_approval) html += `<div class="card"><h2>Karar</h2>
    <textarea id="feedback" placeholder="Reddedersen: ne düzeltilsin? (Coder'a aynen iletilir)"></textarea>
    <div class="row mt">
      <button class="btn-primary" onclick="decide('approve')">✅ Onaylıyorum — dağıt</button>
      <button class="btn-danger" onclick="decide('reject')">❌ Reddet ve düzelttir</button>
    </div></div>`;

  if (d.last_error && d.phase !== "done" && !d.awaiting_approval)
    html += `<div class="card"><h2>Son Hata Çıktısı</h2><pre>${esc(d.last_error)}</pre></div>`;

  html += `<div class="card"><h2>Üretilen Kod</h2><div class="filegrid">
    <div class="filelist" id="filelist"><div class="empty" style="padding:1rem">yükleniyor…</div></div>
    <pre id="filecontent" style="max-height:420px;margin:0">${selectedFile ? "yükleniyor…" : "← dosya seç"}</pre>
  </div></div>`;

  el("detail").innerHTML = html;
  loadFiles();
}

async function loadFiles(){
  if (!selected) return;
  try{
    const files = await (await fetch(`/runs/${selected}/files`)).json();
    if (!Array.isArray(files)){ el("filelist").innerHTML = '<div class="empty" style="padding:1rem">henüz dosya yok</div>'; return; }
    el("filelist").innerHTML = files.map(f =>
      `<div class="${f.path===selectedFile?"sel":""}" onclick="openFile('${esc(f.path)}')">${esc(f.path)}</div>`).join("");
    if (selectedFile) openFile(selectedFile, true);
  }catch(e){}
}

async function openFile(path, silent){
  selectedFile = path;
  if (!silent) document.querySelectorAll("#filelist div").forEach(n => n.classList.toggle("sel", n.textContent === path));
  try{
    const text = await (await fetch(`/runs/${selected}/files/${path}`)).text();
    el("filecontent").textContent = text;
  }catch(e){ el("filecontent").textContent = "(okunamadı)"; }
}

async function startRun(){
  const idea = el("idea").value.trim();
  if (!idea) return;
  const r = await fetch("/runs", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({idea, platform: el("platform").value})});
  const j = await r.json();
  el("idea").value = "";
  select(j.run_id);
}

async function decide(action){
  const feedback = el("feedback") ? el("feedback").value : "";
  if (action === "reject" && !feedback.trim()){ alert("Reddetmek için bir düzeltme talebi yaz — Coder'a iletilecek."); return; }
  await fetch(`/runs/${selected}/${action}`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({feedback})});
  setTimeout(() => renderDetail(true), 900);
}

loadRuns();
timer = setInterval(() => { loadRuns(); if (selected) renderDetail(); }, 5000);
</script>
</body>
</html>
