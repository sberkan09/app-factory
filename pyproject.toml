[project]
name = "app-factory"
version = "0.1.0"
description = "Autonomous mobile app factory - multi-agent pipeline (idea -> spec -> design -> code -> QA -> visual QA -> release -> deploy)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
